services:
  - type: web
    name: aicrm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
    disk:
      name: aicrm-data
      mountPath: /app/data
      sizeGB: 1
